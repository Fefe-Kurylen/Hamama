# Publie automatiquement une mise à jour de Hamama à CHAQUE modification poussée sur GitHub
# (interface web/ ou appli windows/). Les applis Hamama installées la détectent, la téléchargent
# en arrière-plan et affichent le bouton « Mettre à jour » (un redémarrage suffit).
#
# Numéro de version : MAJEUR.MINEUR de windows/package.json + numéro de publication
#   ex. package.json 1.0.0 → 1.0.1, 1.0.2, 1.0.3… (toujours croissant)
name: Windows - mise à jour automatique
# 18/11/2026 : les mises à jour passent par le Microsoft Store → ce workflow ne se lance plus qu'à la main
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Interface (web/index.html → windows/app)
        run: python make-app.py
      - name: Numéro de version
        run: |
          $base = node -p "require('./package.json').version"
          $p = $base.Split('.')
          $v = "$($p[0]).$($p[1]).$([int]$p[2] + ${{ github.run_number }})"
          npm version $v --no-git-tag-version --allow-same-version | Out-Null
          "Version publiée : $v" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Fabrication + publication (installateur, portable, latest.yml)
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

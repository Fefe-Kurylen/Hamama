<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c8703f; --accent-rgb:200,112,63; --danger:#ef4444; --star:#f5b301;
  --hh:52px; --ib:32px; --is:17px; --rb:9px; --rc:13px;
  --sidew:232px; --listw:400px; --sat:max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px)); --sab:max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px));
}
:root,[data-theme=graphite]{--bg:#262624;--panel:#2e2e2b;--panel2:#363633;--line:#3a3a37;--line2:#4a4a46;--text:#f7f6f2;--muted:#bab8b0;--float:rgba(48,48,45,.94);--shade:rgba(0,0,0,.4);--card:#2b2b29}
[data-theme=sombre]{--bg:#0c0c0f;--panel:#141418;--panel2:#1b1b21;--line:#26262e;--line2:#33333d;--text:#f3f3f7;--muted:#a6a6b2;--float:rgba(27,27,33,.9);--shade:rgba(0,0,0,.5);--card:#17171c}
[data-theme=noir]{--bg:#000;--panel:#0a0a0a;--panel2:#151515;--line:#1f1f1f;--line2:#2c2c2c;--text:#f7f7f7;--muted:#a0a0a0;--float:rgba(18,18,18,.94);--shade:rgba(0,0,0,.6);--card:#0d0d0d}
[data-theme=clair]{--bg:#eceef2;--panel:#ffffff;--panel2:#f2f3f6;--line:#e1e4ea;--line2:#d0d4dc;--text:#15161a;--muted:#6b7080;--float:rgba(255,255,255,.94);--shade:rgba(30,35,50,.16);--card:#f7f8fa}
[data-density=compact]{--hh:42px;--ib:27px;--is:15px}
[data-radius=carre]{--rb:3px;--rc:5px}
:root{--rbx:var(--rb)}
[data-radius=rond]{--rb:999px;--rc:22px}
[data-radius=rond]{--rbx:16px}   /* blocs d'information, menus, champs sur plusieurs lignes : pas en forme de pilule */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--uif,Inter),system-ui,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{width:var(--is);height:var(--is);flex:none}
.hidden{display:none!important}
.noacc header .srch,.noacc #refreshBtn,.noacc #compose,.noacc #sideBtn,.noacc header .hsep{display:none!important}
.noacc header .logo{margin-right:auto}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(var(--accent-rgb),.35)}

/* ---------- Barre du haut ---------- */
header{height:calc(var(--hh) + var(--sat));padding:var(--sat) 12px 0;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);background:var(--panel);--ib:36px;--is:19px;font-size:14.5px;position:relative;z-index:20}
[data-density=compact] header{--ib:30px;--is:17px;font-size:13.5px;gap:5px;padding-left:9px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;min-width:0;font-size:15.5px}
.logo .mark{width:calc(var(--ib) - 6px);height:calc(var(--ib) - 6px);border-radius:min(9px,var(--rb));background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 2px 8px rgba(var(--accent-rgb),.2)}
.logo .mark svg{width:calc(var(--is) - 3px);height:calc(var(--is) - 3px)}
.spacer{flex:1}
.btn{height:var(--ib);padding:0 14px;border-radius:var(--rb);display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel2)}
.btn.ghost{border:1px solid var(--line2)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(var(--accent-rgb),.18)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ibtn{width:var(--ib);height:var(--ib);border-radius:var(--rb);display:grid;place-items:center;transition:.15s;color:var(--text);position:relative}
.ibtn:hover{background:var(--panel2)}
.ibtn:disabled{opacity:.3;cursor:default;background:none}
.ibtn.on{background:rgba(var(--accent-rgb),.18);color:var(--accent)}
.heart{color:#ef4444}
.hsep{width:1px;height:calc(var(--ib) - 14px);background:var(--line2);margin:0 3px;flex:none}
.desk header{-webkit-app-region:drag}
.desk header button,.desk header input,.desk header .srch{-webkit-app-region:no-drag}
.plat-win32 header{padding-right:150px}
.plat-darwin header{padding-left:84px}
#compose{height:calc(var(--ib) - 2px)}
.srch{flex:1;max-width:560px;margin:0 auto;height:calc(var(--ib) - 2px);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-radius:var(--rb);background:var(--panel2);border:1px solid transparent;transition:.15s;color:var(--muted);--is:16px}
.srch:focus-within{border-color:var(--accent);background:var(--bg);color:var(--text)}
.srch input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:13.5px}
.srch input::placeholder{color:var(--muted)}
.srch kbd{font:inherit;font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 5px;line-height:18px}
.srch .scope{height:24px;padding:0 8px;border-radius:min(6px,var(--rb));font-size:12px;color:var(--muted);background:var(--panel)}
.srch .scope:hover{color:var(--text)}

/* ---------- Structure 3 colonnes ---------- */
main{position:absolute;top:calc(var(--hh) + var(--sat));left:0;right:0;bottom:0;display:flex}
#side{width:var(--sidew);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .fl{flex:1;overflow:auto;padding:10px 8px}
#side .sfoot{padding:8px;border-top:1px solid var(--line);display:flex;gap:4px}
#side .sfoot .btn{flex:1;justify-content:center;height:34px;font-size:13px;color:var(--muted)}
#side .sfoot .btn:hover{color:var(--text)}
.grip{width:7px;margin:0 -3px;flex:none;cursor:col-resize;position:relative;z-index:6}
.grip::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;transition:.15s}
.grip:hover::after,.grip.on::after{background:var(--accent);width:2px;left:2.5px}
#listCol{width:var(--listw);flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--line);position:relative}
#viewCol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative;background:var(--bg)}
[data-side=hidden] #side,[data-side=hidden] #gripSide{display:none}

.cols{flex:1;display:flex;min-width:0;min-height:0}
/* Disposition « lecture en dessous » */
[data-layout=large] .cols{flex-direction:column}
[data-layout=large] #listCol{width:auto;height:var(--listh,42%);flex:none;border-right:0;border-bottom:1px solid var(--line)}
[data-layout=large] #gripList{width:auto;height:7px;margin:-3px 0;cursor:row-resize}
[data-layout=large] #gripList::after{top:3px;bottom:auto;left:0;right:0;width:auto;height:1px}
[data-layout=large] #gripList:hover::after,[data-layout=large] #gripList.on::after{height:2px;width:auto;left:0}
/* Disposition « focus » : la liste OU le message */
[data-layout=focus] #listCol{flex:1;width:auto;border-right:0}
[data-layout=focus] #gripList{display:none}
[data-layout=focus] #viewCol{display:none}
[data-layout=focus].reading #listCol{display:none}
[data-layout=focus].reading #viewCol{display:flex}
.backBtn{display:none!important}
[data-layout=focus] .backBtn{display:grid!important}

/* ---------- Dossiers ---------- */
.acct{margin-bottom:10px}
.acct > .ah{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rb);cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;user-select:none}
.acct > .ah:hover{color:var(--text)}
.acct > .ah .dot{width:8px;height:8px;border-radius:50%;flex:none}
.acct > .ah .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct > .ah svg{width:14px;height:14px;transition:transform .15s;opacity:.7}
.acct.closed > .ah svg{transform:rotate(-90deg)}
.acct.closed > .fs{display:none}
.acct .err{color:var(--danger);font-size:11.5px;padding:2px 10px 6px;text-transform:none;letter-spacing:0;font-weight:500;cursor:pointer}
.fold{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:var(--rb);color:var(--text);font-size:13.5px;text-align:left;transition:background .12s;--is:17px}
[data-density=compact] .fold{height:28px;font-size:13px;--is:15px;gap:8px}
.fold svg{color:var(--muted)}
.fold .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .n{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.fold.unread .n{color:var(--accent)}
.fold.unread .t{font-weight:600}
.fold:hover{background:var(--panel2)}
.fold.on{background:rgba(var(--accent-rgb),.15);color:var(--text)}
.fold.on svg{color:var(--accent)}
.fold.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(var(--accent-rgb),.12)}
.fold.uni{margin-bottom:10px}

/* ---------- Liste des messages ---------- */
.lhead{display:flex;align-items:center;gap:6px;padding:12px 12px 8px 16px;flex:none}
.lhead h2{font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lhead h2 small{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:6px}
.lhead .ibtn{--ib:30px;--is:16px;color:var(--muted)}
.lhead .ibtn:hover{color:var(--text)}
.chips{display:flex;gap:6px;padding:0 12px 10px 16px;flex:none;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{height:26px;padding:0 11px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500}
.chips button:hover{color:var(--text)}
.chips button.on{background:rgba(var(--accent-rgb),.16);border-color:transparent;color:var(--accent)}
.bulk{display:flex;align-items:center;gap:2px;margin:0 10px 8px;padding:5px 6px 5px 12px;border-radius:var(--rb);background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;flex:none;--ib:28px;--is:16px}
.bulk span{flex:1}
.bulk .ibtn{color:#fff}
.bulk .ibtn:hover{background:rgba(255,255,255,.2)}
#list{flex:1;overflow:auto;padding:0 8px 16px;outline:0;min-height:0}
.grp{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 10px 6px}
.it{position:relative;display:flex;gap:11px;padding:10px 10px 10px 12px;border-radius:var(--rc);cursor:pointer;user-select:none;transition:background .1s;margin-bottom:1px}
[data-density=compact] .it{padding:6px 8px 6px 10px;gap:9px;border-radius:var(--rb)}
.it:hover{background:var(--panel2)}
.it.on{background:rgba(var(--accent-rgb),.15)}
.it.sel{background:rgba(var(--accent-rgb),.22)}
.it.unread::before{content:"";position:absolute;left:3px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--accent)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:13.5px;color:#fff;position:relative;letter-spacing:-.02em}
[data-density=compact] .av{width:28px;height:28px;font-size:11.5px}
.it .av .ck{position:absolute;inset:0;border-radius:50%;background:var(--panel);border:2px solid var(--line2);display:none;place-items:center;color:var(--accent)}
.it:hover .av .ck,.it.sel .av .ck,.selmode .it .av .ck{display:grid}
.it.sel .av .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.it .av .ck svg{width:15px;height:15px;opacity:0}
.it.sel .av .ck svg{opacity:1}
[data-avatars=off] .it .av{display:none}
.it .bd{flex:1;min-width:0}
.it .r1{display:flex;align-items:baseline;gap:8px}
.it .fr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.it.unread .fr{font-weight:700}
.it .dt{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.it.unread .dt{color:var(--accent);font-weight:600}
.it .dt .adot{width:7px;height:7px;border-radius:50%}
.it .sb{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;margin-top:1px}
.it .sb .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.it.unread .sb .s{font-weight:600}
.it .sb svg{width:13px;height:13px;color:var(--muted);flex:none}
.it .sb .star{color:var(--star)}
.it .sb .star svg,.vbar .ibtn.starred svg{fill:var(--star);stroke:var(--star)}
.it .pv{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--pvl,1);margin-top:2px;line-height:1.4}
[data-preview="0"] .it .pv{display:none}
[data-preview="2"]{--pvl:2}
.it .qa{position:absolute;right:8px;top:7px;display:none;gap:1px;background:var(--panel2);border-radius:var(--rb);padding:2px;box-shadow:0 2px 10px var(--shade);--ib:28px;--is:15px}
.it:hover .qa{display:flex}
.it.on .qa,.it.sel .qa{background:var(--panel)}
.qa .ibtn{color:var(--muted)}
.qa .ibtn:hover{color:var(--text);background:var(--line)}
.qa .ibtn.del:hover{color:#fff;background:var(--danger)}
.it.dragging{opacity:.45}
.more{display:block;margin:10px auto;color:var(--muted);font-size:12.5px}
.lempty{text-align:center;color:var(--muted);padding:60px 20px;font-size:13.5px;line-height:1.6}
.lempty .big{font-size:36px;margin-bottom:8px}
.bar{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden;z-index:4;opacity:0;transition:opacity .2s}
.bar.on{opacity:1}
.bar::after{content:"";position:absolute;top:0;height:100%;width:35%;background:var(--accent);border-radius:2px;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%{left:-35%}100%{left:100%}}
.skel{height:64px;border-radius:var(--rc);margin:0 0 6px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- Lecture ---------- */
.vbar{display:flex;align-items:center;gap:3px;padding:8px 14px;flex:none;border-bottom:1px solid var(--line);--ib:36px;--is:19.5px;min-height:53px}
[data-density=compact] .vbar{padding:4px 10px;min-height:43px;--ib:32px;--is:17px}
.vbar .btn{height:var(--ib);padding:0 11px;font-size:13px;gap:7px}
.vbar .lbl-t{}
[data-labels=off] .vbar .lbl-t{display:none}
[data-labels=off] .vbar .btn{padding:0;width:var(--ib);justify-content:center}
.vbar .sep{width:1px;height:20px;background:var(--line2);margin:0 5px;flex:none}
.vbar .ibtn.starred{color:var(--star)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.vin{max-width:var(--readw,980px);margin:0 auto;padding:20px 26px 40px}
[data-density=compact] .vin{padding:14px 18px 30px}
.vin h1{font-size:21px;line-height:1.3;letter-spacing:-.015em;font-weight:600;margin-bottom:16px;word-break:break-word}
.vin h1 .tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;vertical-align:middle;margin-left:8px;letter-spacing:0}
.who{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.who .av{width:42px;height:42px;font-size:15px}
.who .wi{flex:1;min-width:0}
.who .wn{font-weight:600;font-size:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who .wn span{font-weight:400;color:var(--muted);font-size:12.5px}
.who .wt{color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.who .wt b{color:var(--text);font-weight:500}
.who .wd{color:var(--muted);font-size:12.5px;white-space:nowrap}
.addr{cursor:pointer;border-radius:4px}
.addr:hover{color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rbx);background:var(--panel2);font-size:12.5px;color:var(--muted);margin-bottom:12px;--is:16px}
.banner span{flex:1}
.banner button{color:var(--accent);font-weight:600;font-size:12.5px;padding:3px 6px;border-radius:6px}
.banner button:hover{background:rgba(var(--accent-rgb),.12)}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.att{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;border:1px solid var(--line2);border-radius:var(--rbx);background:var(--panel);max-width:280px;cursor:pointer;transition:.12s}
.att:hover{border-color:var(--accent)}
.att .ai{width:32px;height:32px;border-radius:min(8px,var(--rb));background:rgba(var(--accent-rgb),.15);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none;text-transform:uppercase}
.att .an{min-width:0;font-size:12.5px}
.att .an b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .an small{color:var(--muted)}
.att .ibtn{--ib:26px;--is:14px;color:var(--muted)}
.mbody{background:#fff;border-radius:var(--rc);overflow:hidden;box-shadow:0 4px 24px var(--shade)}
[data-mailbg=theme] .mbody{background:var(--panel);box-shadow:none;border:1px solid var(--line)}
.mbody iframe{display:block;width:100%;border:0;min-height:120px;background:transparent}
.qreply{margin-top:16px;display:flex;gap:8px}
.qreply button{flex:1;text-align:left;height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:var(--rc);color:var(--muted);background:var(--panel);font-size:13.5px;display:flex;align-items:center;gap:10px;transition:.15s}
.qreply button:hover{border-color:var(--accent);color:var(--text)}
.qreply button.sm{flex:none;width:auto}
.vempty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.vempty .big{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;background:rgba(var(--accent-rgb),.12);color:var(--accent);display:grid;place-items:center}
.vempty .big svg{width:32px;height:32px}
.vempty h3{color:var(--text);font-size:16px;margin-bottom:6px;font-weight:600}
.vempty .keys{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:12px}
kbd.k{display:inline-block;min-width:20px;text-align:center;font:600 11px Inter,sans-serif;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text);background:var(--panel)}

/* ---------- Accueil (aucun compte) ---------- */
#welcome{position:absolute;inset:0;top:calc(var(--hh) + var(--sat));display:grid;place-items:center;padding:24px;overflow:auto}
.drop{width:min(640px,100%);border:1.5px dashed var(--line2);border-radius:22px;padding:42px 30px;text-align:center;background:radial-gradient(ellipse at top,rgba(var(--accent-rgb),.10),transparent 70%)}
.drop .big{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;background:rgba(var(--accent-rgb),.15);color:var(--accent);display:grid;place-items:center}
.drop .big svg{width:30px;height:30px}
.drop h1{font-size:24px;letter-spacing:-.02em;margin-bottom:8px}
.drop p{color:var(--muted);margin-bottom:24px;line-height:1.6}
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.prov{height:56px;border:1px solid var(--line2);border-radius:var(--rc);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:500;font-size:13.5px;background:var(--panel);transition:.15s;text-align:left}
.prov:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.prov .pl{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.feats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:26px}
.feats span{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:99px}

/* ---------- Fenêtres (modales) ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:16px;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:calc(var(--rc) + 4px);max-height:90vh;overflow:auto;padding:22px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.card.wide{width:min(680px,100%)}
.card.set{width:min(820px,100%);padding:22px 22px 18px;height:min(760px,90vh);display:flex;flex-direction:column;overflow:hidden}
.card.set .setwrap{flex:1;min-height:0}
.card.set [data-body]{overflow:auto;min-height:0;padding-right:6px}
.card.set .tabs.v{overflow:auto}
.setwrap{display:grid;grid-template-columns:180px 1fr;gap:20px;min-height:min(520px,60vh)}
.tabs.v{flex-direction:column;background:none;padding:0;gap:2px;margin:0;overflow:visible}
.tabs.v button{flex:none;text-align:left;height:36px;padding:0 12px;border-radius:var(--rb)}
.tabs.v button:hover{background:var(--panel2);color:var(--text)}
.tabs.v button.on{background:rgba(var(--accent-rgb),.15);color:var(--text);box-shadow:none}
.setwrap [data-body] > .setrow:first-child{margin-top:0}
@media (max-width:700px){.setwrap{grid-template-columns:1fr}.tabs.v{flex-direction:row;overflow-x:auto}}
.card h2{font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.field{width:100%;height:40px;border-radius:min(10px,var(--rbx));background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:0 12px;font:inherit}
.field:focus{outline:2px solid var(--accent);border-color:transparent}
textarea.field{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.lbl{font-size:12px;color:var(--muted);margin:12px 0 6px;display:block}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.note a,.lnk{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.err-box{background:rgba(239,68,68,.12);color:#f87171;border-radius:var(--rbx);padding:10px 12px;font-size:12.5px;margin-top:12px;line-height:1.5}
[data-tone=light] .err-box{color:#c62828}
.ok-box{background:rgba(61,149,121,.14);color:#4fbf97;border-radius:var(--rbx);padding:10px 12px;font-size:12.5px;margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 110px 110px;gap:8px;align-items:end}
.g2 .lbl{margin-top:8px}
details.adv{margin-top:14px;border:1px solid var(--line);border-radius:var(--rbx);padding:10px 12px}
details.adv summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-top:10px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;height:34px;border-radius:9px;font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap;padding:0 10px}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px var(--shade)}
.seg{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:calc(var(--rb) + 3px);flex-wrap:wrap}
.seg button{flex:1;min-width:70px;height:32px;border-radius:var(--rb);color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px var(--shade);outline:1px solid var(--line2)}
.setrow{margin-top:16px}
.setrow > .lbl{margin:0 0 8px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{border:2px solid var(--line2);border-radius:calc(var(--rb) + 2px);padding:6px;text-align:left;font-size:12px;font-weight:500}
.themes button.on{border-color:var(--accent)}
.themes .mini{height:52px;border-radius:min(6px,var(--rbx));margin-bottom:6px;display:flex;overflow:hidden;gap:2px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.sw.on{border-color:var(--text)}
.cpick{position:relative;width:26px;height:26px;border-radius:50%;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);flex:none}
.cpick input{position:absolute;inset:-6px;opacity:0;cursor:pointer}
.swrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.alist .ai{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--rc);margin-bottom:8px}
.alist .ai .av{width:34px;height:34px;font-size:13px}
.alist .ai .t{flex:1;min-width:0}
.alist .ai .t b{display:block;font-weight:600;font-size:13.5px}
.alist .ai .t small{color:var(--muted);font-size:12px}
.sigEd{min-height:80px;max-height:200px;overflow:auto;padding:10px 12px;line-height:1.5;outline:0}
.sup-hero{width:64px;height:64px;border-radius:20px;margin:4px auto 14px;background:rgba(239,68,68,.14);color:#ef4444;display:grid;place-items:center}
.sup-hero svg{width:30px;height:30px}
.paybtn{width:100%;justify-content:center;height:46px;margin-top:16px;font-size:15px}
.keyl{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;font-size:13px}
.keyl div{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}

/* ---------- Rédaction ---------- */
#composer{position:fixed;right:20px;bottom:0;width:min(620px,calc(100vw - 40px));height:min(620px,calc(100vh - var(--hh) - 30px));z-index:40;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:var(--rc) var(--rc) 0 0;box-shadow:0 18px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:up .2s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#composer.max{right:50%;bottom:50%;transform:translate(50%,50%);width:min(980px,calc(100vw - 60px));height:calc(100vh - var(--hh) - 60px);border-radius:var(--rc);border-bottom:1px solid var(--line2);animation:none}
#composer.max{left:50%!important;top:50%!important;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(980px,calc(100vw - 60px))!important;height:calc(100vh - var(--hh) - 60px)!important}
#composer.min{height:auto!important}
#composer.moved{border-bottom:1px solid var(--line2);border-radius:var(--rc);animation:none}
#composer.moved:not(.min){max-height:calc(100vh - var(--hh) - 12px)}
#composer.dragging{animation:none;transition:none;user-select:none;opacity:.96}
html:not(.mobile):not(.narrow) #composer:not(.max) .chead{cursor:move}
.mobile #composer.max{left:0!important;top:0!important;transform:none;width:auto!important;height:auto!important}
#composer.min .cbody,#composer.min .cfoot{display:none}
.chead{display:flex;align-items:center;gap:2px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);cursor:default;--ib:28px;--is:15px;flex:none}
.chead b{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .ibtn{color:var(--muted)}
.chead .ibtn:hover{color:var(--text)}
.cbody{flex:1;display:flex;flex-direction:column;min-height:0}
.cf{display:flex;align-items:center;gap:8px;padding:0 16px;min-height:42px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.cf > label{color:var(--muted);width:46px;flex:none;font-size:13px}
.cf select,.cf input.plain{flex:1;min-width:120px;height:40px;background:none;border:0;outline:0;font-size:13.5px}
.cf select{color:var(--text)}
.cf select option{background:var(--panel)}
.cf .ccb{color:var(--muted);font-size:12.5px;padding:3px 6px;border-radius:6px}
.cf .ccb:hover{color:var(--text);background:var(--panel2)}
.toks{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:120px;padding:5px 0;position:relative}
.toks input{flex:1;min-width:120px;height:30px;background:none;border:0;outline:0;font-size:13.5px}
.tok{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 9px;border-radius:99px;background:var(--panel2);font-size:12.5px;max-width:260px;border:1px solid var(--line2)}
.tok.bad{border-color:var(--danger);color:#f87171}
.tok span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tok button:hover{background:var(--line2);color:var(--text)}
.tok button svg{width:11px;height:11px}
.ac{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:calc(var(--rbx) + 3px);box-shadow:0 14px 40px var(--shade);padding:4px;min-width:280px;max-width:420px}
.ac button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:var(--rb);text-align:left;font-size:13px}
.ac button .av{width:28px;height:28px;font-size:11px}
.ac button small{display:block;color:var(--muted);font-size:11.5px}
.ac button.on,.ac button:hover{background:var(--panel2)}
.etools{display:flex;align-items:center;gap:1px;padding:5px 10px;border-bottom:1px solid var(--line);--ib:28px;--is:15px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
.etools::-webkit-scrollbar{display:none}
.etools .ibtn{flex:none}
.etools .ibtn{color:var(--muted)}
.etools .ibtn:hover,.etools .ibtn.on{color:var(--text)}
.etools .attb{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 9px;border:1px solid var(--line2);border-radius:var(--rb);font-size:12.5px;font-weight:500;color:var(--text);--is:16px;transition:.12s}
.etools .attb:hover{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.etools .sep{width:1px;height:18px;background:var(--line2);margin:0 4px}
.etools select{flex:none;max-width:96px;height:26px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;font-size:12px;padding:0 4px;color:var(--text)}
#ed{flex:1;overflow:auto;padding:16px 18px;outline:0;line-height:1.55;font-size:14px;min-height:80px;word-wrap:break-word}
#ed:empty::before{content:attr(data-ph);color:var(--muted)}
#ed blockquote{border-left:3px solid var(--line2);margin:8px 0;padding:2px 0 2px 12px;color:var(--muted)}
#ed a{color:var(--accent)}
#ed img{max-width:100%}
#ed .sig{color:var(--muted)}
#ed table{border-collapse:collapse}
.catts{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0;flex:none}
.catts:empty{display:none}
.catt{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border-radius:var(--rb);background:var(--panel2);font-size:12.5px;max-width:240px;border:1px solid var(--line2)}
.catt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catt small{color:var(--muted)}
.catt button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.catt button:hover{color:#fff;background:var(--danger)}
.catt button svg{width:12px;height:12px}
.cfoot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex:none;--ib:34px;--is:17px}
.cfoot .st{flex:1;font-size:12px;color:var(--muted);text-align:right;padding-right:6px}
.cfoot .ibtn{color:var(--muted)}
.cfoot .ibtn:hover{color:var(--text)}
.cfoot .ibtn.del:hover{color:#fff;background:var(--danger)}
#composer.dragover::after{content:"Déposer pour joindre";position:absolute;inset:0;display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);border:2px dashed var(--accent);border-radius:inherit;font-weight:600;color:var(--accent);font-size:15px;pointer-events:none}

/* ---------- Bulles, menus, toasts ---------- */
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;box-shadow:0 6px 20px var(--shade)}
#tip.show{opacity:1;transform:none}
#tip kbd{font:inherit;opacity:.55;margin-left:8px;font-size:11px}
.menu,.fpick{position:fixed;z-index:75;background:var(--panel);border:1px solid var(--line2);border-radius:calc(var(--rbx) + 3px);padding:5px;box-shadow:0 16px 44px var(--shade);animation:fd .1s}
.menu{min-width:230px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--rb);text-align:left;font-size:13px;--is:16px}
.menu button svg{color:var(--muted)}
.menu button:hover:not(:disabled){background:var(--panel2)}
.menu button:disabled{opacity:.4;cursor:default}
.menu button.red,.menu button.red svg{color:#f87171}
.menu kbd{margin-left:auto;color:var(--muted);font:inherit;font-size:11px}
.msep{height:1px;background:var(--line);margin:4px 2px}
.fpick{width:280px;display:flex;flex-direction:column;max-height:min(440px,70vh)}
.fpick input{margin:3px 3px 6px;height:34px}
.fpick .fpl{overflow:auto;padding:0 2px 2px}
.fpick h4{font-size:11px;color:var(--muted);font-weight:600;margin:10px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:14px;background:var(--text);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 30px var(--shade);pointer-events:auto;animation:up .2s;max-width:min(560px,90vw)}
.toast button{color:var(--accent);font-weight:700;font-size:13px;padding:3px 8px;border-radius:6px;filter:brightness(1.15)}
[data-tone=light] .toast button{filter:none}
.toast button:hover{background:rgba(var(--accent-rgb),.15)}
.toast.count{position:relative;flex-wrap:wrap;gap:10px 14px;min-width:min(380px,92vw);padding:14px 14px 14px 18px;font-size:15px;font-weight:600;border-radius:16px}
.toast.count>span{flex:1;font-variant-numeric:tabular-nums}
.toast.count button{font-size:14px;padding:7px 14px;border-radius:999px;background:rgba(var(--accent-rgb),.16)}
.toast.count .cbar{flex-basis:100%;height:7px;border-radius:999px;background:rgba(128,128,128,.28);overflow:hidden}
.toast.count .cbar i{display:block;height:100%;width:100%;border-radius:inherit;background:var(--accent);transform-origin:left;animation:cnt var(--dur) linear forwards}
@keyframes cnt{to{transform:scaleX(0)}}
@media (max-width:1000px){ .lbl-t{display:none} .vbar .btn{padding:0;width:var(--ib);justify-content:center} }
@media (max-width:900px){ [data-layout=trois] #viewCol{display:none} [data-layout=trois].reading #listCol{display:none} [data-layout=trois].reading #viewCol{display:flex} [data-layout=trois] .backBtn{display:grid!important} [data-layout=trois] #listCol{flex:1;width:auto} [data-layout=trois] #gripList{display:none} }
@media (max-width:640px){ #side,#gripSide{display:none} .srch kbd,#compose span,.logo span{display:none} #compose{width:var(--ib);padding:0;justify-content:center} }

/* ================= Style épuré (sobre, une seule surface, accent discret) ================= */
[data-theme=clair]{--bg:#f4f3ee;--panel:#eeede7;--panel2:#e7e5de;--line:#e1dfd7;--line2:#d2cfc5;--text:#161513;--muted:#57544e;--float:rgba(244,243,238,.95);--shade:rgba(40,35,25,.14);--card:#efeee8}
[data-tone=light] .mbody{background:color-mix(in srgb,var(--bg) 40%,#fff)}
[data-tone=light] .btn.primary{color:#fff}
/* thèmes de couleur (inspirés de Mailbird) */
[data-theme=nuit]{--bg:#1a2130;--panel:#202838;--panel2:#283246;--line:#2c364a;--line2:#3b475e;--text:#eef2f8;--muted:#a8b3c6;--float:rgba(32,40,56,.94);--shade:rgba(0,0,0,.45);--card:#1e2636}
[data-theme=ardoise]{--bg:#2e3440;--panel:#343b48;--panel2:#3b4252;--line:#414a5a;--line2:#4f596d;--text:#eceff4;--muted:#b6bfcd;--float:rgba(52,59,72,.94);--shade:rgba(0,0,0,.4);--card:#323845}
[data-theme=foret]{--bg:#1a221e;--panel:#202a25;--panel2:#28342e;--line:#2d3832;--line2:#3c4a42;--text:#eef4f0;--muted:#a9baaf;--float:rgba(32,42,37,.94);--shade:rgba(0,0,0,.45);--card:#1e2722}
[data-theme=prune]{--bg:#261d24;--panel:#2e232c;--panel2:#382b35;--line:#3b2e38;--line2:#4d3d49;--text:#f8eff5;--muted:#c6afbd;--float:rgba(46,35,44,.94);--shade:rgba(0,0,0,.45);--card:#2a2029}
[data-theme=ciel]{--bg:#eef3f9;--panel:#e6edf6;--panel2:#dce5f1;--line:#d6e0ec;--line2:#c3cfde;--text:#142033;--muted:#4f5d72;--float:rgba(238,243,249,.95);--shade:rgba(20,40,70,.14);--card:#e9eff7}
[data-theme=menthe]{--bg:#eef6f1;--panel:#e5efe9;--panel2:#d9e8df;--line:#d3e2d9;--line2:#bfd2c6;--text:#13241b;--muted:#4c6355;--float:rgba(238,246,241,.95);--shade:rgba(20,50,35,.14);--card:#e8f1ec}
[data-theme=rose]{--bg:#f9eff2;--panel:#f3e5ea;--panel2:#ecd9e0;--line:#e8d5dc;--line2:#d9bfc9;--text:#2a1820;--muted:#6e5560;--float:rgba(249,239,242,.95);--shade:rgba(60,25,40,.14);--card:#f5e9ed}
header{background:var(--bg);border-bottom-color:var(--line)}
#side{background:var(--bg)}
#side .sfoot{border-top:0}
.logo .mark{box-shadow:none}
.btn.primary{box-shadow:none}
.heart{color:#ef4444}
.heart svg{transform-origin:50% 55%;animation:beat 3.2s ease-in-out infinite}
.heart:hover{background:rgba(239,68,68,.12)!important}
.heart:hover svg{animation-duration:1.1s}
@keyframes beat{0%,62%,100%{transform:scale(1)}68%{transform:scale(1.18)}74%{transform:scale(.96)}80%{transform:scale(1.1)}88%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.heart svg{animation:none}}
.srch{background:var(--panel)}
.srch kbd{display:none}
.srch .scope{background:transparent}
.acct > .ah{text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px}
.fold.on{background:var(--panel2)}
.fold.on svg{color:var(--text)}
.fold.unread .n{color:var(--text)}
.grp{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;padding:14px 10px 4px}
.chips button{border-color:transparent;padding:0 10px}
.chips button:hover{background:var(--panel)}
.chips button.on{background:var(--panel2);color:var(--text)}
.it:hover{background:var(--panel)}
.it.on{background:var(--panel2)}
.it.sel{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
.it.unread .dt{color:var(--text)}
.av:not(.col){background:var(--panel2)!important;color:var(--muted)!important;font-weight:600}
.it .av .ck{background:var(--bg)}
.it.sel .av .ck{background:var(--text);border-color:var(--text);color:var(--bg)}
.it .qa{background:var(--bg);box-shadow:none;border:1px solid var(--line)}
.it.on .qa,.it.sel .qa{background:var(--bg)}
.bulk{background:var(--panel2);color:var(--text)}
.bulk .ibtn{color:var(--text)}
.bulk .ibtn:hover{background:var(--line2)}
.lhead h2{font-size:16px}
.vbar{border-bottom-color:var(--line)}
.vin h1 .tag{border-color:var(--line2)!important;color:var(--muted)!important}
.mbody{box-shadow:none;border:1px solid var(--line)}
.banner{background:transparent;border:1px solid var(--line)}
.att{background:transparent;border-color:var(--line)}
.att:hover{border-color:var(--line2);background:var(--panel)}
.att .ai{background:var(--panel2);color:var(--muted)}
.qreply button{background:transparent;border-color:var(--line)}
.qreply button:hover{border-color:var(--line2);background:var(--panel)}
.vempty .big{background:transparent;color:var(--line2);margin-bottom:10px}
.vempty .keys{opacity:.75}
.drop{border:0;background:none}
.drop .big{background:transparent}
.prov{background:transparent;border-color:var(--line)}
.prov:hover{background:var(--panel);border-color:var(--line2)}
.prov .pl{background:var(--panel2)!important;color:var(--text)}
.card{box-shadow:0 20px 50px rgba(0,0,0,.28)}
.modal{background:rgba(0,0,0,.42);backdrop-filter:blur(2px)}
.tabs.v button.on{background:var(--panel2)}
.themes button,.sw{transition:.12s}
#composer{box-shadow:0 14px 44px rgba(0,0,0,.3);background:var(--bg)}
.toast{box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* messages directement sur le fond de l'appli (comme Mailbird), sans carte blanche */
html[data-mailbg=theme] .mbody{background:transparent;border:0;box-shadow:none;border-radius:0}
/* fenêtre de rédaction : plus grande et plus confortable */
#composer{width:min(860px,calc(100vw - 40px));height:min(760px,calc(100vh - var(--hh) - 24px))}
.chead{padding:10px 10px 10px 18px;--ib:32px;--is:17px}
.chead b{font-size:14.5px}
.cf{min-height:46px;padding:0 18px;font-size:14.5px}
.cf > label{width:50px;font-size:13.5px}
.cf select,.cf input.plain,.toks input{font-size:14.5px}
.cf select,.cf input.plain{height:44px}
.tok{height:28px;font-size:13.5px;padding:0 5px 0 10px}
.etools{padding:7px 12px;gap:2px;row-gap:4px;--ib:32px;--is:17px;flex-wrap:wrap;overflow:visible}
.etools select{height:30px;font-size:13px;max-width:110px}
.etools .sep{height:20px;margin:0 6px}
.etools .attb{height:32px;font-size:13.5px;padding:0 13px 0 10px;--is:17px}
#ed{padding:18px 22px}
.catt{height:32px;font-size:13px}
.cfoot{padding:12px 16px;--ib:38px;--is:19px}
.cfoot .btn.primary.send{height:42px;padding:0 26px;font-size:15px;font-weight:600;gap:9px;--is:18px;margin-left:4px}
/* poignées pour agrandir la fenêtre de rédaction (bords et coins) */
#composer .rz{position:absolute;z-index:3}
#composer .rz[data-d=n]{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
#composer .rz[data-d=s]{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
#composer .rz[data-d=w]{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
#composer .rz[data-d=e]{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
#composer .rz[data-d=nw]{left:-3px;top:-3px;width:14px;height:14px;cursor:nwse-resize}
#composer .rz[data-d=se]{right:-3px;bottom:-3px;width:14px;height:14px;cursor:nwse-resize}
#composer .rz[data-d=ne]{right:-3px;top:-3px;width:14px;height:14px;cursor:nesw-resize}
#composer .rz[data-d=sw]{left:-3px;bottom:-3px;width:14px;height:14px;cursor:nesw-resize}
#composer:is(.max,.min) .rz,:is(.mobile,.narrow) #composer .rz{display:none}
/* citations dans l'éditeur (réponse / transfert) en thème sombre : rendu identique à la lecture */
html:not([data-tone=light]) #ed > blockquote,html:not([data-tone=light]) #ed > .fwd{background:#fff;color:#000;filter:var(--mailf,invert(.85) hue-rotate(180deg));border-left-color:#bbb;padding:4px 10px 4px 12px;border-radius:2px}
html:not([data-tone=light]) #ed > blockquote img,html:not([data-tone=light]) #ed > .fwd img{filter:invert(1) hue-rotate(180deg)}
html:not([data-tone=light]) #ed > blockquote a,html:not([data-tone=light]) #ed > .fwd a{color:#1a73e8}
/* lu / non lu bien distincts (messages et dossiers) */
.it:not(.unread) .fr,.it:not(.unread) .sb .s{color:color-mix(in srgb,var(--text) 80%,var(--bg))}
.it:not(.unread) .pv{color:var(--muted)}
.it:not(.unread) .dt{color:var(--muted)}
.it.unread .fr{font-weight:700;color:var(--text)}
.it.unread .sb .s{font-weight:650;color:var(--text)}
.it.unread .pv{color:color-mix(in srgb,var(--text) 86%,var(--bg))}
.it.unread::before{width:7px;height:7px;margin-top:-3.5px;left:2px}
.fold:not(.unread):not(.on) .t{color:color-mix(in srgb,var(--text) 84%,var(--bg))}
.fold:not(.unread):not(.on) svg{color:var(--muted)}
.fold.unread .t{font-weight:700;color:var(--text)}
.fold.unread .n{font-weight:700;color:var(--text)}
.fold:not(.unread) .n{font-weight:500}
/* titres de section bien distincts des messages */
.grp{color:var(--text);font-weight:700;font-size:12.5px;padding:16px 10px 6px;letter-spacing:.01em}
.lhead h2{font-weight:700;font-size:17px}
.acct > .ah{color:var(--text);font-weight:600}
.vin h1{font-weight:700}
/* écrans tactiles : pas d'actions « au survol » qui restent affichées après un appui */
@media (hover: none){ .it .qa{display:none!important} }
/* tablette : pas de rebond de page, zone du bas (barre d'accueil) respectée */
.tablet,.tablet body{overflow:hidden;overscroll-behavior:none}
.tablet #app{padding-bottom:var(--sab)}
/* séparation des colonnes bien visible */
#side,#listCol{border-right-color:var(--line2)}
[data-layout=large] #listCol{border-bottom-color:var(--line2)}
/* actions au survol d'un message : à droite, centrées, sur le fond de la ligne */
.it{--qabg:var(--panel)}
.it.on,.it.sel{--qabg:var(--panel2)}
.it .qa{top:auto;bottom:5px;right:6px;transform:none;background:var(--qabg)!important;border:0!important;box-shadow:-18px 0 14px -4px var(--qabg)!important;padding:2px 0 2px 2px;--ib:30px;--is:16px}

[dir=rtl] [data-notr]{unicode-bidi:plaintext}
/* ================= Police de l'interface et graisse ================= */
.fonts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fonts button{height:58px;border:2px solid var(--line2);border-radius:calc(var(--rb) + 2px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s}
.fonts button b{font-size:19px;font-weight:600;line-height:1}
.fonts button small{font-size:11.5px;color:var(--muted)}
.fonts button:hover{background:var(--panel)}
.fonts button.on{border-color:var(--accent)}
[data-weight=leger] :is(.logo,.btn,.lhead h2,.vin h1,.who .wn,.card h2,.it.unread .fr,.it.unread .sb .s,.fold.unread .t,.fold .n,.it.unread .dt,.acct>.ah,.att .an b,.prov,.drop h1,.chead b,.bulk,.alist .ai .t b,.fonts button b,.tabs button,.seg button){font-weight:500!important}
[data-weight=leger] :is(.vin h1,.lhead h2,.drop h1,.card h2,.it.unread .fr,.logo){font-weight:600!important}
[data-weight=fin] body *:not(#ed):not(#ed *){font-weight:400!important}
html[data-unreadb=off] .it.unread .fr,html[data-unreadb=off] .it.unread .sb .s,html[data-unreadb=off] .fold.unread .t,html[data-unreadb=off] .it.unread .dt{font-weight:400!important}

/* ================= Téléphone (iPhone / Android) et petites fenêtres ================= */
#drawerBack{display:none}
:is(.mobile,.narrow) #side{display:flex!important;position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:55;transform:translateX(-104%);transition:transform .22s cubic-bezier(.2,.8,.3,1);padding-top:var(--sat);padding-bottom:var(--sab);box-shadow:0 0 40px rgba(0,0,0,.35);border-right:1px solid var(--line)}
[dir=rtl]:is(.mobile,.narrow) #side{left:auto;right:0;transform:translateX(104%)}
:is(.mobile,.narrow).drawer #side{transform:none}
:is(.mobile,.narrow).drawer #drawerBack{display:block;position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.4);animation:fd .15s}
:is(.mobile,.narrow) #gripSide,:is(.mobile,.narrow) #gripList{display:none!important}
:is(.mobile,.narrow) #listCol{flex:1;width:auto!important;height:auto!important;border-right:0;min-width:0}
:is(.mobile,.narrow) #viewCol{min-width:0}
:is(.mobile,.narrow) .cols{min-width:0;overflow:hidden}
.mobile,.mobile body{overflow:hidden;overscroll-behavior:none}
:is(.mobile,.narrow) #viewCol{display:none}
:is(.mobile,.narrow).reading #listCol{display:none}
:is(.mobile,.narrow).reading #viewCol{display:flex}
:is(.mobile,.narrow) .backBtn{display:grid!important}
:is(.mobile,.narrow) .cols{flex-direction:row!important}
:is(.mobile,.narrow) header{gap:4px;padding-left:8px;padding-right:8px}
:is(.mobile,.narrow) .logo span,:is(.mobile,.narrow) .srch kbd,:is(.mobile,.narrow) #compose span,:is(.mobile,.narrow) header .hsep,:is(.mobile,.narrow) #heartBtn{display:none}
:is(.mobile,.narrow) #compose{width:var(--ib);padding:0;justify-content:center}
:is(.mobile,.narrow) .srch{margin:0 2px}
:is(.mobile,.narrow) .srch .scope{display:none}
.mobile #refreshBtn{display:none}
.mobile .it .qa{display:none!important}
.mobile .it{-webkit-touch-callout:none;touch-action:pan-y}
.mobile .it .av .ck{display:none}
.mobile.selmodeOn .it .av .ck,.mobile .it.sel .av .ck{display:grid}
.mobile .fold{height:42px;font-size:15px}
.mobile .it .fr{font-size:15px}.mobile .it .sb{font-size:14px}.mobile .it .pv{font-size:13.5px}
.mobile input,.mobile textarea,.mobile select,.mobile #ed{font-size:16px!important}
.mobile .vempty .keys{display:none}
.mobile #list{padding-bottom:calc(16px + var(--sab))}
.mobile .vin{padding:16px 14px calc(30px + var(--sab))}
.mobile .vin h1{font-size:19px}
.mobile .vbar{padding:6px 8px;gap:0}
.mobile #composer,.mobile #composer.max{inset:0;width:auto;height:auto;transform:none;border-radius:0;border:0;padding-top:var(--sat);padding-bottom:var(--sab);animation:up .2s}
.mobile #composer .chead [data-c=min],.mobile #composer .chead [data-c=max]{display:none}
.mobile .cf > label{width:40px}
.mobile .modal{padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab));align-items:end}
.mobile .card{width:100%!important;max-height:calc(100vh - var(--sat) - var(--sab) - 20px);border-radius:18px;padding:18px}
.mobile .setwrap{grid-template-columns:1fr;min-height:0}
.mobile .card.set{height:auto}
.mobile .tabs.v{flex-direction:row;overflow-x:auto;scrollbar-width:none}
.mobile .tabs.v button{flex:none}
.mobile .themes,.mobile .fonts{grid-template-columns:repeat(2,1fr)}
.mobile #toasts{bottom:calc(22px + var(--sab))}
.mobile:has(#composer) #toasts{bottom:calc(76px + var(--sab))}
.mobile .etools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mobile .etools>*{flex:none}
.mobile .menu{min-width:240px}
.mobile .menu button{padding:11px 12px;font-size:15px}
.mobile #welcome{top:calc(var(--hh) + var(--sat))}
.mobile .drop{padding:26px 14px}
.it.swiping{transition:none!important}
.swipebg{position:absolute;inset:0 0 1px 0;border-radius:var(--rc);display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:600;font-size:13px;gap:8px;z-index:0}
.swipebg.l{justify-content:flex-end;background:#3d9579}
.swipebg.r{justify-content:flex-start;background:var(--accent)}
.swipewrap{position:relative}
.swipewrap > .it{position:relative;z-index:1;background:var(--bg)}

/* ===== Actions au survol : icônes douces + petite animation à la couleur d'accent (18/11) ===== */
.it:hover .qa{animation:qaIn .16s ease-out both}
.qa .ibtn{transition:color .15s,background .15s,transform .15s;animation:qaBtn .22s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--n,0) * 35ms)}
.qa .ibtn svg{transition:transform .18s cubic-bezier(.2,.8,.3,1.3)}
/* une couleur par action (demande de Félix) : favori jaune, archiver vert, répondre bleu, poubelle rouge */
.qa .ibtn{--qc:var(--accent-rgb)}
.qa .ibtn.qstar{--qc:245,179,1}
.qa .ibtn.qarch{--qc:52,168,120}
.qa .ibtn.qrep{--qc:74,144,226}
.qa .ibtn.qdel{--qc:239,83,80}
[data-tone=light] .qa .ibtn.qstar{--qc:214,150,0}
[data-tone=light] .qa .ibtn.qarch{--qc:28,140,94}
[data-tone=light] .qa .ibtn.qrep{--qc:37,110,200}
[data-tone=light] .qa .ibtn.qdel{--qc:214,58,55}
.qa .ibtn.qstar,.qa .ibtn.qarch,.qa .ibtn.qrep,.qa .ibtn.qdel{color:rgba(var(--qc),.85)}
.qa .ibtn:hover,.qa .ibtn.del:hover{color:rgb(var(--qc));background:rgba(var(--qc),.16)}
.qa .ibtn:hover svg{transform:translateY(-1px) scale(1.12)}
.qa .ibtn:active svg{transform:scale(.9)}
.qa .ibtn.qstar.on{color:rgb(var(--qc))}
.qa .ibtn.qstar.on .fillable{fill:currentColor}
.qa .ibtn.pop svg{animation:qaPop .32s ease-out}
@keyframes qaIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
@keyframes qaBtn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes qaPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.it:hover .qa,.qa .ibtn,.qa .ibtn.pop svg{animation:none}.qa .ibtn svg{transition:none}}

/* « Nouveau message » à côté de la recherche (demande de Félix, 18/11) */
.hmid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px}
.hmid .srch{margin:0;flex:1;max-width:560px}
.hmid #compose{flex:none}
.noacc .hmid #compose{display:none!important}

/* ===== Téléphone : liste des boîtes en plein écran + barre du haut à la taille de la recherche (21/11) ===== */
:is(.mobile,.narrow).boxes #side{transform:none!important;top:calc(var(--hh) + var(--sat));left:0;right:0;width:auto;box-shadow:none;border-right:0;padding-top:0;z-index:30;transition:none}
:is(.mobile,.narrow).boxes #listCol,:is(.mobile,.narrow).boxes #viewCol{display:none!important}
:is(.mobile,.narrow).boxes #sideBtn{display:none}
:is(.mobile,.narrow).boxes #drawerBack{display:none!important}
:is(.mobile,.narrow) header{--ib:42px;--is:22px}
:is(.mobile,.narrow){--hh:58px}
:is(.mobile,.narrow) header .logo,:is(.mobile,.narrow) header .logo .mark,:is(.mobile,.narrow) header .ibtn,:is(.mobile,.narrow) #compose{flex:none}
:is(.mobile,.narrow) header .logo .mark{width:calc(var(--ib) - 2px);height:calc(var(--ib) - 2px);border-radius:min(12px,var(--rb))}
:is(.mobile,.narrow) header .logo .mark svg{width:calc(var(--is) + 2px);height:calc(var(--is) + 2px)}
:is(.mobile,.narrow) header .ibtn{width:calc(var(--ib) - 2px);height:calc(var(--ib) - 2px)}
:is(.mobile,.narrow) header .ibtn svg{width:var(--is);height:var(--is)}
:is(.mobile,.narrow) #compose{width:calc(var(--ib) - 2px)!important;height:calc(var(--ib) - 2px);min-width:0;padding:0;justify-content:center;border-radius:min(12px,var(--rb))}
:is(.mobile,.narrow) #compose svg{width:var(--is);height:var(--is)}
:is(.mobile,.narrow) .srch{min-width:0;height:calc(var(--ib) - 2px)}
:is(.mobile,.narrow) .hmid{gap:6px}

/* ===== Téléphone : style moderne, minimaliste et fluide (21/11) ===== */
:is(.mobile,.narrow) header{border-bottom:0;--ib:44px;--is:22px;padding-left:10px;padding-right:10px;gap:6px}
:is(.mobile,.narrow):not(.boxes) header .logo{display:none}
/* icônes aux bords fondus : fond teinté doux, sans arête nette */
:is(.mobile,.narrow) header .logo .mark{border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(var(--accent-rgb),.30),rgba(var(--accent-rgb),.10) 70%,rgba(var(--accent-rgb),0));color:var(--accent);box-shadow:none}
:is(.mobile,.narrow) header .ibtn{border-radius:50%;color:var(--text)}
:is(.mobile,.narrow) header .ibtn:active{background:rgba(128,128,128,.16)}
:is(.mobile,.narrow) #compose{border-radius:50%!important;border:0;background:radial-gradient(circle at 50% 35%,rgba(var(--accent-rgb),1),rgba(var(--accent-rgb),.85));box-shadow:0 0 0 4px rgba(var(--accent-rgb),.10),0 6px 18px rgba(var(--accent-rgb),.32)}
:is(.mobile,.narrow) #compose:active{transform:scale(.94)}
:is(.mobile,.narrow) .srch{border-radius:999px;border:0;background:rgba(128,128,128,.13);padding:0 16px;gap:10px;font-size:15px}
:is(.mobile,.narrow) .srch:focus-within{background:rgba(128,128,128,.18);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.35)}
:is(.mobile,.narrow) .srch input::placeholder{color:var(--muted);opacity:.8}
/* liste */
.mobile .lhead{padding:10px 16px 6px 20px}
.mobile .lhead h2{font-size:27px;font-weight:700;letter-spacing:-.02em}
.mobile .chips{padding:2px 16px 8px 20px;gap:8px}
.mobile .chips button{height:32px;padding:0 14px;font-size:13.5px;border:0;background:rgba(128,128,128,.12)}
.mobile .chips button.on{background:rgba(var(--accent-rgb),.18)}
.mobile .grp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.85;padding:18px 12px 6px}
.mobile .it{padding:12px 12px 12px 14px;gap:13px;border-radius:18px;transition:background .15s,transform .15s}
.mobile .it:active{background:rgba(128,128,128,.10)}
.mobile .it .av{width:44px;height:44px;flex:none}
/* boîtes */
.mobile #side .acct > .ah{font-size:13px;padding:14px 12px 8px}
.mobile .fold{height:50px;padding:0 14px;border-radius:16px;font-size:16px;gap:14px;--is:20px}
.mobile .fold:active{background:rgba(128,128,128,.10)}
.mobile #side .sfoot{border-top:0}
/* fenêtres et messages éphémères */
.mobile .toast{border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mobile .modal .card{border-radius:24px 24px 18px 18px}
/* fluidité : pas de délai au toucher, rendu des lignes hors écran différé */
.mobile button,.mobile a,.mobile .it,.mobile .fold,.mobile label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mobile .it{touch-action:pan-y;content-visibility:auto;contain-intrinsic-size:auto 86px}
.mobile #list,.mobile #side .fl,.mobile #view{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* bandeau « images bloquées » sur téléphone : texte sur toute la largeur, boutons dessous */
:is(.mobile,.narrow) .banner{flex-wrap:wrap;gap:6px 10px;padding:12px 14px;font-size:13px;line-height:1.4}
:is(.mobile,.narrow) .banner span{flex:1 1 calc(100% - 30px);min-width:0}
:is(.mobile,.narrow) .banner button{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(var(--accent-rgb),.12)}
:is(.mobile,.narrow) .banner button:first-of-type{margin-left:26px}

/* ===== Téléphone v2 (22/11) : grandes cibles tactiles, inspiré de Mail d'Apple et de Gmail ===== */
:is(.mobile,.narrow){--hh:64px}
:is(.mobile,.narrow) header{--ib:48px;--is:25px;gap:8px;padding-left:8px;padding-right:12px}
:is(.mobile,.narrow) header .ibtn{width:48px;height:48px}
:is(.mobile,.narrow) header .logo .mark{width:44px;height:44px}
:is(.mobile,.narrow) .srch{height:48px!important;font-size:16px;--is:20px}
:is(.mobile,.narrow) .srch input{font-size:16px}
/* « Écrire » : gros bouton flottant en bas à droite (comme Gmail) */
:is(.mobile,.narrow) #compose{position:fixed;right:18px;bottom:calc(20px + var(--sab));z-index:40;width:auto!important;height:58px!important;padding:0 22px 0 18px!important;gap:10px;border-radius:20px!important;font-size:16px;font-weight:600;--is:24px;box-shadow:0 8px 24px rgba(0,0,0,.35),0 2px 6px rgba(var(--accent-rgb),.35)}
:is(.mobile,.narrow) #compose span{display:inline!important}
:is(.mobile,.narrow).reading #compose,:is(.mobile,.narrow) .noacc #compose{display:none!important}
.mobile #list{padding-bottom:calc(96px + var(--sab))}
/* liste plus lisible */
.mobile .it{padding:13px 12px 13px 14px;gap:14px}
.mobile .it .av{width:48px;height:48px;font-size:16px}
.mobile .it .fr{font-size:16.5px}
.mobile .it .sb{font-size:15px;margin-top:2px}
.mobile .it .pv{font-size:14.5px;margin-top:3px}
.mobile .it .dt{font-size:13px}
.mobile .it .sb svg{width:15px;height:15px}
/* lecture : barre du haut de l'appli masquée, Retour en haut, grosses actions en bas */
:is(.mobile,.narrow).reading header{display:none}
:is(.mobile,.narrow).reading main{top:0}
:is(.mobile,.narrow) .vtop{border-bottom:0;padding:calc(6px + var(--sat)) 10px 2px;min-height:0;--ib:48px;--is:25px;gap:4px}
:is(.mobile,.narrow) .vtop .backBtn{--is:28px}
:is(.mobile,.narrow) .vbot{flex:none;display:flex;justify-content:space-around;align-items:center;padding:6px 6px calc(6px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}

.mobile .vbot{gap:0}
.mobile .vbot button + button{border-left:0}
/* boîtes : titre de section un peu plus détaché */
.mobile.boxes #side .acct{margin-top:6px}

/* ===== iPhone (26/11 soir) : style Mail d'Apple, commandes Hamama conservées ===== */
#lsub{display:none}
.mobile #lsub{display:block;font-size:14.5px;color:var(--muted);font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.mobile .lhead{flex-wrap:wrap;align-items:center;padding:6px 12px 10px;border-bottom:1px solid var(--line2);margin:0 4px 4px}
.mobile .lhead h2{font-size:34px!important;font-weight:800;letter-spacing:-.025em;line-height:1.12}
.mobile .lhead #lsub{order:3;flex-basis:100%}
.mobile .it .dt::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);margin:0 2px 1px 8px;opacity:.7}
.mobile .it .pv{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;white-space:normal;overflow:hidden}
.mobile.boxes .bxhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.mobile.boxes .bxt{grid-column:2;align-items:center;padding-left:0}
.mobile.boxes .bxt b{font-size:19px;font-weight:750}
.mobile.boxes .bxhead .bxbtn{grid-column:3;justify-self:end}
.mobile.boxes #side .acct > .ah{font-size:24px;font-weight:800;padding:10px 12px 10px}
.mobile .menu button.red span{color:#e5534b}

/* ===== Windows (26/11) : même style que le téléphone ===== */
html:not(.mobile) #lsub{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:3;flex-basis:100%}
html:not(.mobile) .lhead{flex-wrap:wrap;padding-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line2);margin:0 8px 2px}
html:not(.mobile) .lhead h2{font-size:24px!important;font-weight:800;letter-spacing:-.02em}
html:not(.mobile) #list .it{position:relative;border-radius:10px}
html:not(.mobile) #list .it::before{content:"";position:absolute;left:58px;right:8px;bottom:0;height:1px;background:var(--line2);opacity:.6}
html:not(.mobile) #list .it.on::before,html:not(.mobile) #list .it:hover::before{opacity:0}
html:not(.mobile) .grp{letter-spacing:.08em;font-size:11px;padding-top:14px}
/* menus : groupes séparés par une bande, icônes couleur d'accent, blocage en rouge */
html:not(.mobile) .menu{padding:6px 0;border-radius:16px}
html:not(.mobile) .menu button{border-radius:0;padding-left:14px;padding-right:14px}
html:not(.mobile) .menu .msep{height:6px;margin:4px 0;background:rgba(0,0,0,.2)}
html:not(.mobile)[data-tone=light] .menu .msep{background:rgba(0,0,0,.05)}
html:not(.mobile) .menu button svg{color:var(--accent)}
html:not(.mobile) .menu button.red span,html:not(.mobile) .menu button.red svg{color:#e5534b}
/* réglages : chaque option dans sa carte */
html:not(.mobile) .card.set .setrow{margin:0 0 10px;padding:12px 14px;background:rgba(128,128,128,.08);border-radius:14px}
html:not(.mobile) .card.set .setrow > .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px}
html:not(.mobile) .card.set .tabs.v button.on{background:var(--accent);color:#fff}

/* ===== iPhone (26/11 nuit) : liste des mails comme Mail d'Apple ===== */
.mobile #list .it{padding:12px 6px 12px 10px!important;gap:12px;align-items:flex-start}
.mobile #list .it.unread::before{left:22.5px;top:max(50%, 62px);margin-top:-5px;width:10px;height:10px;background:var(--accent)}
.mobile #list .it .av{width:35px;height:35px;font-size:13px;margin-top:1px;align-self:flex-start}
.mobile #list .it .fr{font-size:17px;font-weight:700}
.mobile #list .it:not(.unread) .fr{font-weight:650}
.mobile #list .it .dt{font-size:15px;color:var(--muted);font-weight:500}
.mobile #list .it .sb{font-size:15.5px;margin-top:2px}
.mobile #list .it .sb .s{color:var(--text);font-weight:600}
.mobile #list .it:not(.unread) .sb .s{font-weight:500;opacity:.92}
.mobile #list .it .pv{font-size:15px;line-height:1.35;margin-top:2px;color:var(--muted)}

/* tirer pour actualiser */
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;transition:height .2s ease}
.ptr i{width:24px;height:24px;border-radius:50%;border:2.5px solid rgba(128,128,128,.35);border-top-color:var(--accent);display:block;opacity:.55}
.ptr.ready i{opacity:1}
.ptr.spin i{animation:ptrspin .8s linear infinite;opacity:1}
@keyframes ptrspin{to{transform:rotate(360deg)}}

/* Téléphone (26/11) : trait léger entre l'expéditeur et le message */
:is(.mobile,.narrow) .vin .who{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line2)}

#ltitle{white-space:nowrap;overflow:hidden;min-width:0}
.mobile #side .fl,.mobile #list,.mobile .menu,.mobile .fpick{overflow-x:hidden!important;touch-action:pan-y}

.mobile #side,.mobile #listCol,.mobile #viewCol,.mobile main{max-width:100vw;overflow-x:hidden}
.mobile .ptr{max-width:100%;overflow:hidden}
</style>

"Les messages des expéditeurs bloqués vont directement dans Indésirables, sans notification. Pour bloquer tout un domaine, écris @domaine.fr.":["Messages from blocked senders go straight to Junk, with no notification. To block a whole domain, type @domain.com.","Los mensajes de remitentes bloqueados van directamente a No deseado, sin notificación. Para bloquear todo un dominio, escribe @dominio.com.","Nachrichten blockierter Absender landen direkt im Junk, ohne Benachrichtigung. Um eine ganze Domain zu blockieren, gib @domain.de ein.","I messaggi dei mittenti bloccati vanno direttamente in Indesiderata, senza notifica. Per bloccare un intero dominio, scrivi @dominio.it.","As mensagens de remetentes bloqueados vão diretamente para o Lixo eletrónico, sem notificação. Para bloquear um domínio inteiro, escreve @dominio.pt.","تذهب رسائل المرسلين المحظورين مباشرة إلى غير المرغوب فيه دون إشعار. لحظر نطاق كامل اكتب ‎@domain.com."],
"Ses messages iront directement dans Indésirables, sans notification. Ceux déjà reçus y seront aussi déplacés.":["Their messages will go straight to Junk, with no notification. Those already received will be moved there too.","Sus mensajes irán directamente a No deseado, sin notificación. Los ya recibidos también se moverán allí.","Die Nachrichten landen direkt im Junk, ohne Benachrichtigung. Bereits empfangene werden ebenfalls dorthin verschoben.","I suoi messaggi andranno direttamente in Indesiderata, senza notifica. Anche quelli già ricevuti verranno spostati lì.","As mensagens irão diretamente para o Lixo eletrónico, sem notificação. As já recebidas também serão movidas.","ستذهب رسائله مباشرة إلى غير المرغوب فيه دون إشعار، وستُنقل إليه الرسائل المستلمة سابقًا أيضًا."],

const LANGS = [['fr','Français'],['en','English'],['es','Español'],['de','Deutsch'],['it','Italiano'],['pt','Português'],['ar','العربية']];
const LIDX = { en:0, es:1, de:2, it:3, pt:4, ar:5 };
const LOCALES = { fr:'fr-FR', en:'en-GB', es:'es-ES', de:'de-DE', it:'it-IT', pt:'pt-PT', ar:'ar' };
const LANG = (() => {
  let l = 'auto';
  try { l = (JSON.parse(localStorage.getItem('hamama-settings') || '{}').lang) || 'auto'; } catch {}
  if (l === 'auto') l = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  return LOCALES[l] ? l : 'en';
})();
const LOC = LOCALES[LANG];
const TRX = [];   // modèles avec parties variables
for (const k of Object.keys(I18N)) if (k.includes('{0}')) TRX.push([new RegExp('^' + k.replace(/[.*+?^$()[\]\\|]/g, '\\$&').replace(/\{(\d)\}/g, '(.+?)') + '$'), k]);
TRX.sort((a, b) => b[1].length - a[1].length);   // les modèles les plus précis d’abord
/** Traduit un texte français de l’interface (inchangé si inconnu) */
function T(s){
  if (LANG === 'fr' || s == null) return s;
  const raw = String(s), core = raw.trim(); if (!core) return raw;
  const i = LIDX[LANG];
  let out = I18N[core] ? I18N[core][i] : null;
  if (out == null) for (const [re, k] of TRX){ const m = core.match(re); if (m){ out = I18N[k][i].replace(/\{(\d)\}/g, (x, n) => T(m[+n + 1])); break; } }
  if (out == null) return raw;
  return raw.replace(core, out);
}
const TR_ATTRS = ['title', 'placeholder', 'data-tip', 'aria-label', 'data-ph'];
function trTree(root){
  if (LANG === 'fr' || !root) return;
  if (root.nodeType === 3){ if (!root.parentElement || !root.parentElement.closest('[data-notr],#ed,textarea,script,style')){ const v = T(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1 || root.closest('[data-notr],#ed,textarea,script,style')) return;
  const els = [root, ...root.querySelectorAll('*')];
  for (const el of els){
    if (el.closest('[data-notr],#ed,textarea,script,style')) continue;
    for (const a of TR_ATTRS){ const v = el.getAttribute(a); if (v){ const t = T(v); if (t !== v) el.setAttribute(a, t); } }
    for (const n of el.childNodes) if (n.nodeType === 3 && n.nodeValue.trim()){ const t = T(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
  }
}
if (LANG !== 'fr'){
  document.documentElement.lang = LANG;
  if (LANG === 'ar') document.documentElement.dir = 'rtl';
  new MutationObserver(ms => { for (const m of ms){
    if (m.type === 'characterData') trTree(m.target);
    else if (m.type === 'attributes') { const v = m.target.getAttribute(m.attributeName); if (v){ const t = T(v); if (t !== v) m.target.setAttribute(m.attributeName, t); } }
    else m.addedNodes.forEach(trTree);
  } }).observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: TR_ATTRS });
  trTree(document.body);
}

function fitTitle(){ const el = $('#ltitle'); if (!el) return; requestAnimationFrame(() => { el.style.removeProperty('font-size'); if (!el.clientWidth) return; let fs = parseFloat(getComputedStyle(el).fontSize) || 24; let n = 0; while (el.scrollWidth > el.clientWidth + 1 && fs > 13 && n++ < 60){ fs -= 1; el.style.setProperty('font-size', fs + 'px', 'important'); } }); }
  addEventListener('resize', () => fitTitle());
  { let lw = -1; const ro = new ResizeObserver(es => { const w = Math.round(es[0].contentRect.width); if (w && w !== lw){ lw = w; fitTitle(); } }); requestAnimationFrame(() => { const t = $('#ltitle'); if (t) ro.observe(t.parentElement); }); }
  if (document.fonts) document.fonts.ready.then(() => fitTitle());
  function syncText(){ const t = ST.syncAt; if (!t) return 'Mise à jour…'; return Date.now() - t < 60000 ? 'Mis à jour à l’instant' : T('Mis à jour à {0}', new Date(t).toLocaleTimeString(LOC, { hour:'2-digit', minute:'2-digit' })); }
setInterval(() => { const e = document.getElementById('bxSync'); if (e) e.textContent = syncText(); }, 30000);
function renderSide(){
  const vk = viewKey(), el = $('#folders');
  const PH = MOBILE && !TABLET;   // téléphone : boîtes en cartes, comme Mail d'Apple
  const CH = PH ? `<span class="chv">${ic('right')}</span>` : '';
  let h = PH ? `<div class="bxhead"><div class="bxt"><b>Boîtes</b><small id="bxSync">${syncText()}</small></div><button class="bxbtn" data-bxset title="Personnaliser Hamama">${ic('settings')}</button></div>` : '';
  let topInbox = null;   // téléphone avec un seul compte : sa Réception dans la carte du haut
  if (ST.accounts.length > 1 && SET.unified === 'on'){
    const n = unseenTotal();
    h += `${PH ? '<div class="bxcard">' : ''}<button class="fold uni${vk === 'uni' ? ' on' : ''}${n ? ' unread' : ''}" data-uni="1">${ic(PH ? 'inbox' : 'layers')}<span class="t">${PH ? 'Réception' : 'Toutes les boîtes'}</span>${n ? `<span class="n">${n}</span>` : ''}${CH}</button>${PH ? '</div>' : ''}`;
  }
  for (const a of ST.accounts){
    const fl = ST.folders[a.id] || [];
    h += `<div class="acct${collapsed.has(a.id) ? ' closed' : ''}" data-acc="${a.id}"><div class="ah" data-ah="${a.id}"><span class="dot" style="background:${accColor(a)}"></span><span class="nm" data-notr>${esc(accLabel(a))}</span>${ic('chev')}</div>`;
    if (ST.accErr[a.id]) h += `<div class="err" data-fix="${a.id}">${esc(ST.accErr[a.id]).slice(0, 120)}</div>`;
    h += `<div class="fs${PH ? ' bxcard' : ''}">`;
    if (!fl.length && !ST.accErr[a.id]) h += '<div class="skel" style="height:30px;margin:4px 6px"></div><div class="skel" style="height:30px;margin:4px 6px"></div>';
    for (const f of fl){
      if (topInbox && f.path === topInbox && a === ST.accounts[0]) continue;
      const n = SET.counts === 'none' ? 0 : SET.counts === 'total' && !['inbox','junk'].includes(f.role) ? f.total : f.unseen;
      const unread = f.unseen && !['trash','sent','junk','drafts'].includes(f.role);   // Indésirables, Corbeille… jamais en gras
      h += `<button class="fold${vk === a.id + '|' + f.path ? ' on' : ''}${unread ? ' unread' : ''}" data-acc="${a.id}" data-box="${esc(f.path)}" style="${PH ? '--dp:' + f.depth : 'padding-left:' + (10 + f.depth * 16) + 'px'}">${ic(ROLE_IC[f.role] || 'folder')}<span class="t"${f.role ? '' : ' data-notr'}>${esc(f.name)}</span>${n && (f.role !== 'trash' && f.role !== 'sent' || SET.counts === 'total') ? `<span class="n">${n}</span>` : ''}${CH}</button>`;
    }
    h += '</div></div>';
  }
  if (PH) h += `<div class="bxcard bxadd"><button class="fold" data-addacc>${ic('plus')}<span class="t">Ajouter un compte</span></button></div>`;
  el.innerHTML = h;
  const n = unseenTotal();
  document.title = n ? `Hamama (${n})` : 'Hamama';
  if (N) N.badge(n).catch(() => {});
}

  if (e.target.closest('[data-addacc]')) return document.getElementById('addAccBtn').click();

  if (ah){ const id = ah.dataset.ah; collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); store.set('hamama-collapsed', JSON.stringify([...collapsed])); ah.parentNode.classList.toggle('closed'); return; }

async function loadFolders(id){
  try { ST.folders[id] = await N.mail.folders(id); delete ST.accErr[id]; ST.syncAt = Date.now(); }
  catch (e) { ST.accErr[id] = cleanErr(e); }
  renderSide();
}
const loadAllFolders = () => Promise.all(ST.accounts.map(a => loadFolders(a.id)));
let foldT = null;
const refreshFoldersSoon = (id, ms = 1500) => { clearTimeout(foldT); foldT = setTimeout(() => id ? loadFolders(id) : loadAllFolders(), ms); };
function bumpUnseen(acc, box, d){ const f = folderOf(acc, box); if (f){ f.unseen = Math.max(0, f.unseen + d); renderSide(); } }

async function newFolder(acc, parent){
  const n = await promptBox('Nouveau dossier', parent ? `Dans « ${(folderOf(acc, parent) || {}).name || parent} »` : 'Nom du dossier', '', 'Créer'); if (!n) return;
  const f = folderOf(acc, parent); const path = parent ? parent + ((f && f.delimiter) || '/') + n : n;
  try { ST.folders[acc] = await N.mail.mkdir(acc, path); renderSide(); toast('Dossier créé'); } catch (e) { errToast(e); }
}
async function renameFolder(acc, box){
  const f = folderOf(acc, box); const n = await promptBox('Renommer le dossier', 'Nouveau nom', f.name, 'Renommer'); if (!n || n === f.name) return;
  const parts = box.split(f.delimiter || '/'); parts[parts.length - 1] = n;
  try { ST.folders[acc] = await N.mail.rename(acc, box, parts.join(f.delimiter || '/')); renderSide(); } catch (e) { errToast(e); }
}
async function deleteFolder(acc, box){
  const f = folderOf(acc, box);
  if (!await confirmBox('Supprimer le dossier ?', `« ${f.name} » et les messages qu’il contient seront supprimés définitivement.`, 'Supprimer', true)) return;
  try { ST.folders[acc] = await N.mail.rmdir(acc, box); if (viewKey() === acc + '|' + box) openDefault(); renderSide(); } catch (e) { errToast(e); }
}
async function emptyFolder(acc, box){
  const f = folderOf(acc, box);
  if (!await confirmBox(`Vider « ${f.name} » ?`, `${plural(f.total, 'message')} ser${f.total > 1 ? 'ont' : 'a'} supprimé${f.total > 1 ? 's' : ''} définitivement.`, 'Vider', true)) return;
  try { await N.mail.empty(acc, box); f.total = 0; f.unseen = 0; renderSide(); if (viewKey() === acc + '|' + box){ ST.items = []; renderList(); showEmptyView(); } toast('Dossier vidé'); } catch (e) { errToast(e); }
}
async function markAllRead(acc, box){
  try {
    if (ST.view && ST.view.uni) await Promise.all(ST.accounts.map(a => N.mail.allRead(a.id, 'INBOX')));
    else await N.mail.allRead(acc, box);
    ST.items.forEach(i => { if (ST.view.uni || (i.acc === acc && i.box === box)) i.seen = true; });
    (ST.view.uni ? ST.accounts.map(a => folderOf(a.id, 'INBOX')) : [folderOf(acc, box)]).forEach(f => f && (f.unseen = 0));
    renderSide(); renderList();
  } catch (e) { errToast(e); }
}

/* ================= Liste des messages ================= */
let loadTok = 0;
const setBusy = b => $('#lbar').classList.toggle('on', !!b);
function viewTitle(){
  if (ST.search) return `Résultats « ${ST.search} »`;
  if (!ST.view) return '';
  if (ST.view.uni) return 'Toutes les boîtes';
  const f = folderOf(ST.view.acc, ST.view.box);
  return f ? f.name : ST.view.box;
}
async function openView(v, { keepOpen = false } = {}){
  ST.view = v; ST.search = null; $('#q').value = ''; ST.sel.clear(); ST.more = false; ST.ulimit = 40;
  if (!keepOpen){ ST.open = null; ST.msg = null; showEmptyView(); document.documentElement.classList.remove('reading'); }
  store.set('hamama-view', JSON.stringify(v));
  renderSide(); $('#ltitle').textContent = viewTitle(); fitTitle();
  ST.items = [];
  if (!v.uni){ try { const c = await N.mail.cached(v.acc, v.box); if (c.items && viewKey() === v.acc + '|' + v.box) ST.items = c.items; } catch {} }
  renderList(!ST.items.length);
  return refreshList();
}
function openDefault(){
  const saved = J('hamama-view', null);
  if (saved && (saved.uni ? ST.accounts.length > 1 && SET.unified === 'on' : accOf(saved.acc))) return openView(saved);
  if (ST.accounts.length > 1 && SET.unified === 'on') return openView({ uni: true });
  if (ST.accounts[0]) return openView({ acc: ST.accounts[0].id, box: 'INBOX' });
}
async function refreshList(){
  const v = ST.view; if (!v || ST.search) return;
  const tok = ++loadTok; setBusy(true);
  try {
    let r;
    if (v.uni){ r = await N.mail.unified({ limit: ST.ulimit }); r.errors && r.errors.forEach(x => ST.accErr[x.acc] = x.err); }
    else r = await N.mail.list(v.acc, v.box, { offset: 0, limit: Math.max(50, Math.min(200, ST.items.length || 50)) });
    if (tok !== loadTok) return;
    ST.items = r.items; ST.more = r.more; ST.total = r.total || r.items.length;
    if (!v.uni) delete ST.accErr[v.acc];
    r.items.forEach(i => i.from && i.from[0] && learn(i.from[0], 0.05));
    renderList();
  } catch (e) {
    if (tok !== loadTok) return;
    if (!v.uni){ ST.accErr[v.acc] = cleanErr(e); renderSide(); }
    renderList(); errToast(e);
  } finally { if (tok === loadTok) setBusy(false); }
}
async function loadMore(){
  const v = ST.view; if (!v || !ST.more) return;
  if (v.uni){ ST.ulimit += 40; return refreshList(); }
  setBusy(true);
  try {
    const r = await N.mail.list(v.acc, v.box, { offset: ST.items.length, limit: 50 });
    const have = new Set(ST.items.map(i => i.key));
    ST.items.push(...r.items.filter(i => !have.has(i.key))); ST.more = r.more; renderList();
  } catch (e) { errToast(e); } finally { setBusy(false); }
}
const visible = () => ST.items.filter(i => ST.filter === 'all' || (ST.filter === 'unread' && !i.seen) || (ST.filter === 'flagged' && i.flagged) || (ST.filter === 'att' && i.att));
function itemHTML(i){

  const who = (role === 'sent' || role === 'drafts' || i.draft) ? (i.to || []).map(nameOf).join(', ') || '(sans destinataire)' : nameOf(i.from && i.from[0]) || '(inconnu)';
  const whoA = (role === 'sent' || role === 'drafts') ? (i.to || [])[0] : (i.from || [])[0];
  const cls = ['it', i.seen ? '' : 'unread', ST.open === i.key ? 'on' : '', ST.sel.has(i.key) && ST.sel.size > 0 && (ST.sel.size > 1 || ST.selMode) ? 'sel' : ''].join(' ');
  const a = accOf(i.acc);
  const QA_ORDER = ['star','archive','reply','read','trash'];
  const qa = QA_ORDER.filter(q => SET.qa.includes(q)).map((q, n) => ({
    star: `<button class="ibtn qstar${i.flagged ? ' on' : ''}" data-q="${i.flagged ? 'unstar' : 'star'}" title="${i.flagged ? 'Ne plus suivre (S)' : 'Suivre (S)'}">${ic('qstar')}</button>`,
    archive: `<button class="ibtn qarch" data-q="archive" title="Archiver (E)">${ic('qarchive')}</button>`,
    reply: `<button class="ibtn qrep" data-q="reply" title="Répondre (R)">${ic('qreply')}</button>`,
    read: `<button class="ibtn" data-q="${i.seen ? 'unread' : 'read'}" title="${i.seen ? 'Marquer comme non lu (U)' : 'Marquer comme lu (U)'}">${ic(i.seen ? 'mail' : 'mail-open')}</button>`,
    trash: `<button class="ibtn del qdel" data-q="trash" title="Supprimer (Suppr)">${ic('qtrash')}</button>`

    <div class="sb"><span class="s"${i.subject ? ' data-notr' : ''}>${esc(i.subject || '(sans objet)')}</span>${i.att ? ic('clip') : ''}${i.answered ? `<span title="Répondu" style="display:flex">${ic('reply')}</span>` : ''}${i.flagged ? `<span class="star" style="display:flex">${ic('star')}</span>` : ''}</div>
    <div class="pv" data-notr>${esc(i.preview || '')}</div></div>
    ${qa ? `<div class="qa">${qa}</div>` : ''}</div>`;
